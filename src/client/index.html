<!doctype html>
<html lang="zh-CN">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guess Steam Comments</title>
    <link rel="stylesheet" href="/src/client/styles.css">
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" id="brandName" href="/" aria-label="Guess Steam Comments"></a>
        <nav class="language-switch" id="languageSwitch"></nav>

      <main class="intro-page" aria-labelledby="pageTitle">

            <h1 id="pageTitle"></h1>
            <p class="intro-text" id="introText"></p>
            <button class="login-button" id="loginButton" type="button">
              <span id="loginButtonText"></span>
            </button>
            <p class="login-status" id="loginStatus" aria-live="polite"></p>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/client/main.js"></script>
