<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guess Steam Comments</title>
    <link rel="stylesheet" href="/src/client/styles.css">
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="topbar-left">
          <a class="brand" id="brandName" href="/" aria-label="Guess Steam Comments"></a>
          <div class="account-summary" id="accountSummary" hidden>
            <img class="account-avatar" id="accountAvatar" alt="">
            <span class="account-id" id="accountSteamId"></span>
            <button class="logout-button" id="logoutButton" type="button">
              <span id="logoutButtonText"></span>
            </button>
          </div>
        </div>
        <nav class="language-switch" id="languageSwitch"></nav>
      </header>

      <main class="app-main">
        <section class="login-screen" id="loginScreen" aria-labelledby="pageTitle">
          <div class="login-band">
            <div class="login-copy">
              <h1 id="pageTitle"></h1>
              <p class="intro-text" id="introText"></p>
              <button class="login-button" id="loginButton" type="button">
                <span id="loginButtonText"></span>
              </button>
              <p class="login-status" id="loginStatus" aria-live="polite"></p>
            </div>
          </div>
        </section>

        <section class="menu-screen" id="mainMenuScreen" aria-labelledby="menuTitle" hidden>
          <div class="menu-stage" id="menuStage">
            <div class="menu-options">
              <h1 class="menu-title" id="menuTitle" tabindex="-1"></h1>
              <div class="mode-list" id="modeList"></div>
              <div class="menu-navigation" id="menuNavigation"></div>
            </div>
            <aside class="mode-description" id="modeDescription" aria-hidden="true"></aside>
          </div>
        </section>

        <section class="history-screen" id="guessedGamesScreen" aria-labelledby="guessedGamesTitle" hidden>
          <div class="history-stage">
            <header class="history-header">
              <h1 class="history-title" id="guessedGamesTitle" tabindex="-1"></h1>
              <p class="history-total" id="guessedGamesTotal"></p>
            </header>

            <section class="history-content" aria-live="polite">
              <div class="history-loading-panel" id="guessedGamesLoadingPanel" hidden>
                <div class="history-loading-progress" id="guessedGamesLoadingProgress" role="progressbar" aria-labelledby="guessedGamesLoading">
                  <span></span>
                </div>
                <p class="history-loading" id="guessedGamesLoading"></p>
              </div>
              <p class="history-empty" id="guessedGamesEmpty" hidden></p>
              <div class="history-list" id="guessedGamesList"></div>
              <nav class="history-pagination" id="guessedGamesPagination" aria-label="">
                <button class="history-page-button" id="guessedGamesPreviousButton" type="button"></button>
                <span class="history-page-status" id="guessedGamesPageStatus"></span>
                <button class="history-page-button" id="guessedGamesNextButton" type="button"></button>
              </nav>
            </section>

            <footer class="history-actions">
              <button class="return-menu-button" id="guessedGamesReturnMenuButton" type="button"></button>
              <button class="history-clear-button" id="guessedGamesClearButton" type="button"></button>
              <p class="history-status" id="guessedGamesStatus" aria-live="polite"></p>
            </footer>
          </div>
        </section>

        <section class="game-screen" id="standardGameScreen" aria-labelledby="standardGameTitle" hidden>
          <div class="game-stage">
            <div class="game-play-layout" id="standardPlayLayout">
              <section class="game-main-area" aria-labelledby="standardGameTitle">
                <h1 class="game-title" id="standardGameTitle" tabindex="-1"></h1>
                <div class="video-area" aria-live="polite">
                  <video class="game-video" id="standardGameVideo" controls playsinline></video>
                </div>
                <div class="game-loading-panel" id="standardGameLoadingPanel" hidden>
                  <div class="game-loading-progress" id="standardGameLoadingProgress" role="progressbar" aria-labelledby="standardGameLoading">
                    <span></span>
                  </div>
                  <p class="game-loading" id="standardGameLoading" aria-live="polite"></p>
                </div>
                <form class="guess-form" id="standardGuessForm">
                  <label class="guess-label" id="standardGuessLabel" for="standardGuessInput"></label>
                  <div class="guess-control-row">
                    <input class="guess-input" id="standardGuessInput" name="reviewCountGuess" type="number" min="50" step="1" inputmode="numeric">
                    <button class="guess-submit" id="standardGuessButton" type="submit"></button>
                  </div>
                  <p class="guess-hint" id="standardGuessHint"></p>
                  <p class="guess-status" id="standardGuessStatus" aria-live="polite"></p>
                </form>
              </section>

              <aside class="game-status-area" aria-live="polite">
                <div class="status-line">
                  <span class="status-label" id="standardHealthLabel"></span>
                  <span class="status-value" id="standardHealthValue"></span>
                </div>
                <div class="status-line">
                  <span class="status-label" id="standardScoreLabel"></span>
                  <span class="status-value" id="standardScoreValue"></span>
                </div>
                <div class="status-line">
                  <span class="status-label" id="standardStreakLabel"></span>
                  <span class="status-value" id="standardStreakValue"></span>
                </div>
                <div class="status-line">
                  <span class="status-label" id="standardGuessNumberLabel"></span>
                  <span class="status-value" id="standardGuessNumberValue"></span>
                </div>

                <section class="revealed-game" id="standardRevealedGame" hidden>
                  <h2 id="standardGameInfoHeading"></h2>
                  <a class="revealed-cover-link" id="standardGameCoverLink" target="_blank" rel="noreferrer noopener">
                    <img class="revealed-cover" id="standardGameCover" alt="">
                  </a>
                  <a class="revealed-name" id="standardGameName" target="_blank" rel="noreferrer noopener"></a>
                  <p class="revealed-review-count" id="standardReviewCount"></p>
                  <p class="round-result" id="standardRoundResult"></p>
                </section>
                <p class="waiting-reveal" id="standardWaitingReveal"></p>
              </aside>
            </div>

            <section class="game-result-layout" id="standardResultLayout" hidden>
              <h1 class="result-title" id="standardResultTitle" tabindex="-1"></h1>
              <p class="result-stat" id="standardFinalScore"></p>
              <p class="result-stat" id="standardFinalStreak"></p>
              <p class="record-notice" id="standardRecordNotice"></p>
              <section class="result-last-game" id="standardLastGame">
                <h2 id="standardLastGameHeading"></h2>
                <a class="revealed-cover-link" id="standardLastGameCoverLink" target="_blank" rel="noreferrer noopener">
                  <img class="revealed-cover" id="standardLastGameCover" alt="">
                </a>
                <a class="revealed-name" id="standardLastGameName" target="_blank" rel="noreferrer noopener"></a>
                <p class="revealed-review-count" id="standardLastGameReviewCount"></p>
              </section>
              <div class="result-actions">
                <button class="restart-button" id="standardRestartButton" type="button"></button>
                <button class="return-menu-button" id="standardReturnMenuButton" type="button"></button>
              </div>
            </section>
          </div>
        </section>
      </main>

      <dialog class="history-dialog" id="guessedGamesClearDialog" aria-labelledby="guessedGamesClearDialogHeading">
        <div class="history-dialog-layout">
          <h2 id="guessedGamesClearDialogHeading"></h2>
          <p id="guessedGamesClearDialogBody"></p>
          <div class="history-dialog-actions">
            <button class="history-dialog-cancel" id="guessedGamesClearCancelButton" type="button"></button>
            <button class="history-dialog-confirm" id="guessedGamesClearConfirmButton" type="button"></button>
          </div>
        </div>
      </dialog>
    </div>

    <script type="module" src="/src/client/main.js"></script>
  </body>
</html>
